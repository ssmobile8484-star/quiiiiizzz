<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>簡單刷題小工具</title>
    <style>
        body { font-family: '微軟正黑體', Arial, sans-serif; background: #f5f5f5; }
        .box { width: 350px; margin: 60px auto; background: #fff; border-radius: 10px; padding: 32px 28px; box-shadow: 0 3px 16px #ddd; }
        .btn { margin-top: 20px; padding: 10px 22px; background: #3987fa; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .answer { margin: 20px 0; }
        .explain { color: #397ac3; }
        .score { color: #888; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="question"></h2>
        <div id="options"></div>
        <button class="btn" onclick="checkAnswer()">檢查答案</button>
        <div class="answer" id="result"></div>
        <button class="btn" onclick="nextQuestion()">下一題</button>
        <div class="score" id="score"></div>
    </div>
<script>
const data = [
    {
        q: "二進位 1011 轉十進位是多少？",
        options: ["7", "9", "11", "13"],
        answer: 2,
        explain: "1011 = 1x8 + 0x4 + 1x2 + 1x1 = 11"
    },
    {
        q: "十六進位A3代表十進位多少？",
        options: ["153", "163", "243", "203"],
        answer: 1,
        explain: "A=10, A3=10x16+3=163"
    },
    {
        q: "下列哪一項是二進位有效的表達方式？",
        options: ["10120", "11101", "2011", "22"],
        answer: 1,
        explain: "只有0和1可以出現在二進位"
    },
];
let score = 0, i = 0;
function renderQuestion() {
    document.getElementById("question").innerText = data[i].q;
    let ops = '';
    data[i].options.forEach((o, idx) => {
        ops += `<div>
            <input type="radio" name="opt" id="opt${idx}" value="${idx}">
            <label for="opt${idx}">${String.fromCharCode(65+idx)}. ${o}</label>
        </div>`;
    });
    document.getElementById("options").innerHTML = ops;
    document.getElementById("result").innerHTML = "";
    document.getElementById("score").innerHTML = `目前得分: ${score}/${i}`;
}
function checkAnswer() {
    let sel = document.querySelector('input[name="opt"]:checked');
    if (!sel) { alert('請先選擇答案！'); return; }
    let ans = Number(sel.value);
    if (ans === data[i].answer) {
        document.getElementById("result").innerHTML = `<span style="color:green">✔ 答對了！</span><div class="explain">${data[i].explain}</div>`;
        score++;
    } else {
        document.getElementById("result").innerHTML = `<span style="color:red">✘ 答錯了</span><div class="explain">${data[i].explain}</div>`;
    }
    document.getElementById("score").innerHTML = `目前得分: ${score}/${i+1}`;
}
function nextQuestion() {
    i = (i+1) % data.length;
    renderQuestion();
}
window.onload = renderQuestion;
</script>
</body>
</html>
